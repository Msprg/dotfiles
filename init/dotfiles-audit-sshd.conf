# dotFiles audit identity over SSH.
# Install to /etc/ssh/sshd_config.d/50-dotfiles-audit.conf, then
# `sshd -t && systemctl reload sshd`. Requires OpenSSH >= 7.8 for the
# per-variable allowlist (older sshd only accepts a bare `yes`, which also
# permits LD_PRELOAD etc. from a user's own authorized_keys — avoid that).
#
# Then, per shared-account key in ~/.ssh/authorized_keys:
#   environment="BASH_HISTORY_USERNAME=alice" ssh-ed25519 AAAA... alice
PermitUserEnvironment BASH_HISTORY_USERNAME
