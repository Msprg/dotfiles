# dotFiles audit login-session map. Recreated on every boot because /run is
# tmpfs — this is deliberate: audit session ids are reused (low numbers) after
# a reboot, so a stale map must never survive one.
# 1733 = anyone may create their own <sessionid> file; the sticky bit stops
# them deleting or overwriting anyone else's; files are 0600 per user.
d /run/dotfiles-audit          0755 root root -
d /run/dotfiles-audit/sessions 1733 root root -
